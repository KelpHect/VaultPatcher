[package]
name = "vault_patcher"
version = "0.1.0"
edition = "2024"
description = "Patcher, tweaker and mod installer for the Borderlands series"
build = "build.rs"

[[bin]]
name = "VaultPatcher"
path = "src/main.rs"

[dependencies]
gpui = "0.2.2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
zip = { version = "2", default-features = false, features = ["deflate"] }
ureq = { version = "2", features = ["json"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
flate2 = "1"
tar = "0.4"
ash = { version = "0.38", default-features = false, features = ["loaded", "std"] }
rodio = { version = "0.20", default-features = false, features = ["symphonia-mp3"] }
image = { version = "0.25", default-features = false, features = ["bmp", "png", "jpeg"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
winresource = "0.1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
strip = true
